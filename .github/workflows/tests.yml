name: tests

# Runs the grace-ent test suite. The tests validate the committed analytic
# dataset and analysis outputs (they do not refit models), so CI only needs R
# and testthat — no Census/API keys, no Valhalla, no mysterycall package.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install test dependencies
        run: |
          Rscript -e 'pk <- c("testthat", "dplyr", "readr", "here", "remotes"); miss <- pk[!vapply(pk, requireNamespace, logical(1), quietly = TRUE)]; if (length(miss)) install.packages(miss)'
          # mysteryroster carries the registry-validity analysis that tests/testthat/test-mysteryroster-parity.R checks
          # tarball URL, not install_github: no GitHub API call, so no token or rate limit
          Rscript -e 'remotes::install_url("https://github.com/mufflyt/mysteryroster/archive/refs/heads/main.tar.gz", upgrade = "never")'
          Rscript -e 'cat("mysteryroster", as.character(packageVersion("mysteryroster")), "\n")'

      - name: Run test suite
        run: Rscript tests/run_tests.R
