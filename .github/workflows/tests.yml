name: tests

# Runs the grace-ent test suite. The tests validate the committed analytic
# dataset and analysis outputs (they do not refit models), so CI only needs R
# and testthat — no Census/API keys, no Valhalla, no mysterycall package.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install test dependencies
        run: |
          Rscript -e 'pk <- c("testthat", "dplyr", "readr", "here", "remotes", "checkmate", "survey", "tibble", "stringi"); miss <- pk[!vapply(pk, requireNamespace, logical(1), quietly = TRUE)]; if (length(miss)) install.packages(miss)'
          # Install the mystery* packages from tarballs with R CMD INSTALL (via
          # install.packages on the archive), NOT remotes::install_url:
          # install_url processes DESCRIPTION `Remotes:` fields through the
          # GitHub API (api.github.com), which is rate-limited on shared CI
          # runners. R CMD INSTALL ignores Remotes entirely, so no API call is
          # made and there is no token or rate-limit dependency.
          Rscript -e 'download.file("https://github.com/mufflyt/mysterynpi/archive/refs/heads/master.tar.gz", "mysterynpi.tar.gz"); install.packages("mysterynpi.tar.gz", repos = NULL, type = "source")'
          Rscript -e 'download.file("https://github.com/mufflyt/mysteryroster/archive/refs/heads/main.tar.gz", "mysteryroster.tar.gz"); install.packages("mysteryroster.tar.gz", repos = NULL, type = "source")'
          Rscript -e 'cat("mysteryroster", as.character(packageVersion("mysteryroster")), "\n")'

      - name: Run test suite
        run: Rscript tests/run_tests.R
