---
# ==============================================================================
# ENT PROCEDURE CATEGORIES — anchor-code map for specialty verification
# ==============================================================================
# Purpose: Group CPT/HCPCS codes into clinically meaningful procedure categories,
#          each anchored by a single "inclusive representative code" that stands
#          in for the whole category in summary tables, claim-volume rollups,
#          and downstream specialty-verification logic.
#
# Use case: Verifying that a physician's Medicare Part B billing pattern is
#           consistent with otolaryngology practice. Joining an NPI's claim
#           CPT codes against this file yields:
#             - the procedure_category for each claim
#             - the procedure_group it rolls up into
#             - the inclusive_representative_code that anchors the group
#
# Schema (loaded by R/ent_procedure_categories.R into a tibble that matches
# the original ent_procedure_cpt_codes tribble field-for-field):
#   procedure_category            -> top-level clinical category
#   cpt_code                      -> individual CPT
#   procedure_group               -> rollup label (= procedure_category in v1)
#   inclusive_representative_code -> single anchor CPT for the whole group
#   description (optional)        -> human-readable CPT description
#
# Date: 2026-05-15
# Version: 1.0.0
# Board: American Board of Otolaryngology (ABOto)
# Sources:
#   - User-supplied tribble (2026-05-15 conversation, Tyler Muffly)
#   - CPT descriptions cross-referenced with config/phase3_procedure_map_ent.yml
# ==============================================================================

metadata:
  component: ent_procedure_categories
  version: 1.0.0
  created: "2026-05-15"
  specialty: "ent"
  board: "ABOto"
  description: >-
    Procedure-category map for ENT specialty verification.  Each category
    enumerates the CPT codes that fall under it and identifies one
    "inclusive representative code" that anchors the group in summaries.

  total_categories: 11
  total_codes: 71

  notes:
    - "Anchor CPTs were selected for clinical centrality, not billing volume."
    - "Categories are intentionally narrow: a category is a single procedure
       type (e.g., 'Sinus surgery' covers FESS variations; FESS is a category,
       not a subspecialty)."
    - "For SUBSPECIALTY-level mapping (Rhinology vs Head & Neck Oncology vs
       Otology / etc.), see config/phase3_procedure_map_ent.yml."
    - "v1.1 (2026-05-15) added three diagnostic / office-procedure categories
       (ENT diagnostic procedures, Otolaryngic allergy, Vestibular evaluation)
       to raise empirical match rate from 36% to ~90% of the Triple Match
       cohort (4,578 NPIs). Empirical data: scripts/discover_ent_billed_codes.R,
       run 2026-05-15."
    - "Codes were chosen by frequency of billing among Triple Match NPIs AND
       specificity to ENT practice. Generic E&M codes (99202-99215, 99211)
       are intentionally EXCLUDED — they are billed by every specialty and
       would destroy specificity."

# ==============================================================================
# PROCEDURE CATEGORIES
# ==============================================================================

