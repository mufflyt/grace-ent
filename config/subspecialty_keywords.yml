# =============================================================================
# GENERAL SPECIALTY CLASSIFICATION
# =============================================================================
# When no subspecialty is found but primary specialty is confirmed,
# classify as "General [Specialty]"

general_classification:
  obgyn:
    default_name: "General Obstetrics and Gynecology"
    apply_when:
      - "No subspecialty found after all enrichment layers"
      - "Confirmed OB/GYN via taxonomy code 207V%"
      - "Confirmed OB/GYN via ABMS board certification"

  ent:
    default_name: "General Otolaryngology"
    apply_when:
      - "No subspecialty found after all enrichment layers"
      - "Confirmed ENT via taxonomy code 207Y%"
      - "Confirmed ENT via ABMS board certification"

  orthopedics:
    default_name: "General Orthopedic Surgery"
    apply_when:
      - "No subspecialty found after all enrichment layers"
      - "Confirmed Orthopedics via taxonomy code 207X%"

# =============================================================================
# PATTERN MATCHING RULES
# =============================================================================
matching_rules:
  # Case-insensitive matching
  case_sensitive: false

  # Word boundary matching (avoid partial matches)
  # Example: "SINUS" matches "SINUS CENTER" but not "BUSINESS"
  word_boundary: true

  # Priority handling when multiple matches found
  # Options: "highest_priority", "first_match", "most_specific"
  conflict_resolution: "highest_priority"

  # Minimum keyword length to avoid false positives
  min_keyword_length: 3
