#
# Example 2: Get OB/GYN women 18-90
#
# active_profile: "obgyn"
#
# config <- yaml::read_yaml("config/acs_demographics_config.yaml")
# profile <- config$obgyn
#
# # Use pattern matching to find variables
# vars <- load_variables(2022, "acs5")
# female_vars <- vars %>%
#   filter(str_detect(label, profile$population$acs_label_pattern))
#
# Example 3: Custom age range (e.g., women 50-85 for breast cancer screening)
#
# Add custom profile to this file, then use it same way as above

# Best Practices
# =============================================================================
#
# 1. Always specify age range relevant to specialty
#    - Don't include irrelevant ages (e.g., infants for cardiac surgery)
#    - Do include full relevant range (e.g., all ages for ENT)
#
# 2. Consider sex restrictions carefully
#    - OB/GYN: women only (specialty-specific care)
#    - Urology: traditionally men, but many urologists treat women
#    - Most specialties: both sexes
#
# 3. Use standard race/ethnicity across all specialties
#    - Enables disparity comparisons between specialties
#    - Table B03002 is the gold standard
#
# 4. Document rationale in description field
#    - Why this age range?
#    - Why this sex restriction?
#    - What clinical population does this represent?
#
# 5. Test queries on small sample first
#    - Query 1 state before querying all 50+
#    - Verify variable counts match expected population
#    - Check for missing data or unexpected results
