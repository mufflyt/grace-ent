# Common Age Ranges by Specialty (Reference)
# =============================================================================
specialty_age_ranges:
  obgyn: "18-90 (reproductive through elderly women)"
  pediatrics: "0-17 (children and adolescents)"
  geriatrics: "65+ (elderly)"
  family_medicine: "0-85+ (all ages)"
  internal_medicine: "18+ (adults)"
  cardiology: "18+ (adults, slightly older skew)"
  oncology: "0-85+ (all ages, cancer across lifespan)"
  orthopedics: "0-85+ (all ages, fractures to joint replacement)"
  ent: "0-85+ (all ages, ear infections to hearing loss)"
  urology: "18+ men primarily, some women"
  dermatology: "0-85+ (all ages)"
  psychiatry: "0-85+ (all ages, pediatric through elderly)"
  neurology: "0-85+ (all ages)"

