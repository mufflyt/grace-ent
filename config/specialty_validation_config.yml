    database: "${nber_duckdb_main}"
    table: "medicare_part_b_physicians"
    provider_type_filter: "provider_type ILIKE '%orthop%' OR provider_type ILIKE '%orthopaed%'"
    required_fields:
      - npi
      - hcpcs_code
      - line_srvc_cnt
      - average_medicare_payment_amount

# ===============================================================================
# VALIDATION SETTINGS (Common across all specialties)
# ===============================================================================
validation_settings:
  # Output directory for validation reports
  output_dir: "artifacts/validation_reports"

  # Report format
  report_format:
    - html
    - csv

  # Generate detailed plots?
  generate_plots: true

  # Include raw data in reports?
  include_raw_data: false

  # Timestamp format for output files
  timestamp_format: "%Y%m%d_%H%M%S"

  # Minimum sample size for reliable validation
  min_sample_size: 100

  # Statistical test settings
  statistical_tests:
    method: "spearman"           # Correlation method
    significance_level: 0.05     # p-value threshold
    confidence_interval: 0.95    # CI width

  # Performance settings
  performance:
    max_physicians_sample: 50000   # Maximum physicians to sample
    parallel_processing: false     # Use multi-core?
    timeout_minutes: 60            # Maximum runtime

# ===============================================================================
# INTERPRETATION GUIDELINES
# ===============================================================================
interpretation:
  concordance_levels:
    high:
      threshold: 0.7
      interpretation: "Strong alignment between claimed subspecialty and billing patterns"
      recommendation: "Classification appears accurate"

    medium:
      threshold: 0.4
      interpretation: "Moderate alignment - may indicate mixed practice or billing complexity"
      recommendation: "Review individual cases for clarification"

    low:
      threshold: 0.4
      interpretation: "Poor alignment - may indicate classification issues or practice evolution"
      recommendation: "Consider alternative classification methods or investigate discrepancies"

