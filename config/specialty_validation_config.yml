      - "56405"  # Incision and drainage of vulva or perineal abscess
      - "56441"  # Lysis of labial adhesions
      - "57061"  # Destruction of vaginal lesion(s)
      - "57100"  # Biopsy of vaginal mucosa, simple
      - "58120"  # Dilation and curettage, diagnostic and/or therapeutic
      # Congenital anomaly repair (pediatric)
      - "56800"  # Plastic repair of introitus
      - "57335"  # Vaginoplasty for congenital anomaly

    GO:
      # Radical surgical procedures (cancer-specific)
      - "58210"  # Radical abdominal hysterectomy (Wertheim hysterectomy)
      - "58240"  # Pelvic exenteration for gynecologic malignancy
      - "58150"  # Total abdominal hysterectomy with or without removal of tube(s)
      - "58180"  # Supracervical abdominal hysterectomy
      # Lymphadenectomy (cancer staging/treatment)
      - "38570"  # Laparoscopy, surgical; with retroperitoneal lymph node sampling
      - "38571"  # Laparoscopy, surgical; with pelvic lymphadenectomy
      - "38572"  # Laparoscopy, surgical; with para-aortic lymphadenectomy
      - "38589"  # Unlisted laparoscopy procedure, lymphatic system
      # Cancer-specific procedures
      - "49255"  # Omentectomy, separate procedure
      - "58950"  # Resection (initial) of ovarian, tubal or primary peritoneal malignancy
      - "58952"  # Resection of ovarian malignancy with pelvic lymphadenectomy
      - "58953"  # Bilateral salpingo-oophorectomy with omentectomy
      - "58954"  # Resection of ovarian malignancy with radical dissection
      - "58956"  # Bilateral salpingo-oophorectomy with total omentectomy
      # Chemotherapy administration (GO-specific)
      - "96413"  # Chemotherapy administration, intravenous push
      - "96415"  # Chemotherapy administration, intravenous infusion
      # Advanced imaging for cancer surveillance
      - "74178"  # CT abdomen and pelvis with contrast (cancer surveillance)

  # Validation thresholds
  thresholds:
    concordance_high: 0.7      # >70% = strong match
    concordance_medium: 0.4    # 40-70% = moderate match
    concordance_low: 0.4       # <40% = poor match
    min_procedures: 10         # Minimum procedures to assess concordance
    min_sample_size: 100       # Minimum physicians per subspecialty

  # Medicare data source
  medicare:
    database: "${nber_duckdb_main}"
    table: "medicare_part_b_physicians"
    provider_type_filter: "provider_type ILIKE '%obstetrics%' OR provider_type ILIKE '%gynecology%'"
    required_fields:
      - npi
      - hcpcs_code
      - line_srvc_cnt
      - average_medicare_payment_amount

