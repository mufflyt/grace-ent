---
# ===============================================================================
# SPECIALTY VALIDATION CONFIGURATION - SPECIALTY-AGNOSTIC
# ===============================================================================
#
# Purpose: Configure physician specialty validation for any medical specialty
# Validates: Claimed specialty matches actual practice patterns (billing, board certification)
# Last updated: 2025-10-13
#
# HOW THIS WORKS:
# 1. Load ground truth from board certification (ABOG for OB/GYN, ABO for ENT, etc.)
# 2. Load Medicare billing patterns (HCPCS procedure codes)
# 3. Calculate concordance: Does claimed subspecialty match billing?
# 4. Generate validation report with precision/recall metrics
#
# TO SWITCH SPECIALTIES: Change active_specialty below (obgyn -> ent -> ortho)
# Zero code changes needed - all validation parameters in this config!
#
# ===============================================================================

# Currently active specialty for validation
active_specialty: "obgyn"  # Options: "obgyn", "ent", "ortho", "cardio", etc.

# ===============================================================================
# OB/GYN VALIDATION PROFILE
# ===============================================================================
obgyn:
  name: "Obstetrics & Gynecology Subspecialty Validation"
  description: "Validate ABOG subspecialty classifications against Medicare billing patterns"

  # Ground truth: Board certification data (GOLD STANDARD)
  ground_truth:
    source: "ABOG"
    full_name: "American Board of Obstetrics and Gynecology"
    file: "data/0-Download/output/abog_provider_dataframe_8_17_2025_1948_only_workforce_directory1.csv"
    subspecialty_field: "subspecialty_name"  # Column name in ABOG file
    npi_field: "npi"

    # Subspecialty name mappings (ABOG uses different names than we do)
    subspecialty_mappings:
      GEN_OBGYN:
        - "General OB/GYN"
        - "General Obstetrics"
        - "General Gynecology"
        - "OB/GYN"
      FPMRS:
        - "FPMRS"
        - "Female Pelvic Medicine"
        - "Urogynecology"
      GO:
        - "GO"
        - "Gynecologic Oncology"
        - "General"
      MFM:
        - "MFM"
        - "Maternal-Fetal Medicine"
        - "Maternal"
      REI:
        - "REI"
        - "Reproductive Endocrinology"
        - "Reproductive"
      MIGS:
        - "MIGS"
        - "MIG"
        - "Minimally Invasive"
        - "MIS"
      PAG:
        - "PAG"
        - "Pediatric and Adolescent"
        - "Pediatric"

  # Target subspecialties for validation
  subspecialties:
    - GEN_OBGYN  # General Obstetrics & Gynecology
    - FPMRS      # Female Pelvic Medicine and Reconstructive Surgery
    - GO         # Gynecologic Oncology
    - MFM        # Maternal-Fetal Medicine
    - REI        # Reproductive Endocrinology and Infertility
    - MIGS       # Minimally Invasive Gynecologic Surgery
    - PAG        # Pediatric and Adolescent Gynecology

  # NPPES taxonomy codes for this specialty
  taxonomy_codes:
    primary: "207V00000X"   # Obstetrics & Gynecology (general)
    subspecialty:
      GO: "207VG0400X"      # Gynecologic Oncology
      MFM: "207VM0101X"     # Maternal & Fetal Medicine
      REI: "207VX0201X"     # Reproductive Endocrinology
      # Note: FPMRS, MIG, PAG don't have unique taxonomy codes

  # Medicare billing patterns: HCPCS procedure codes by subspecialty
  # Source: Clinical knowledge + Medicare billing data analysis
  procedure_codes:
    GEN_OBGYN:
      # Preventive care and screening
      - "88142"  # Cytopathology, cervical or vaginal (Pap smear)
      - "88143"  # Cytopathology, cervical or vaginal, with manual screening
      - "88147"  # Cytopathology smears, cervical or vaginal; screening by automated system
      - "88175"  # Cytopathology, cervical or vaginal (including evaluation of atypical cells)
      - "99384"  # Initial comprehensive preventive medicine (adolescent)
      - "99385"  # Initial comprehensive preventive medicine (18-39 years)
      - "99386"  # Initial comprehensive preventive medicine (40-64 years)
      - "99387"  # Initial comprehensive preventive medicine (65+ years)
      # Routine office visits
      - "99213"  # Office visit, established patient
      - "99214"  # Office visit, established patient, moderate complexity
      - "99215"  # Office visit, established patient, high complexity
      # Common procedures
      - "57452"  # Colposcopy of cervix including upper/adjacent vagina
      - "57454"  # Colposcopy of cervix with biopsy
      - "57455"  # Colposcopy of cervix with endocervical curettage
      - "58300"  # Insertion of intrauterine device (IUD)
      - "58301"  # Removal of intrauterine device (IUD)
      - "76830"  # Ultrasound, transvaginal
      - "76856"  # Ultrasound, pelvic (non-obstetric)
      # Obstetric care
      - "59400"  # Routine obstetric care including delivery
      - "59409"  # Vaginal delivery only
      - "59410"  # Vaginal delivery including postpartum care
      - "59510"  # Routine obstetric care including cesarean delivery
      - "59610"  # VBAC (vaginal birth after cesarean)
      - "59618"  # VBAC including postpartum care
      # Common gynecologic procedures
      - "58150"  # Total abdominal hysterectomy
      - "58552"  # Hysteroscopy, surgical; with removal of intrauterine foreign body
      - "58558"  # Hysteroscopy, surgical; with biopsy
      - "58563"  # Hysteroscopy, surgical; with endometrial ablation

    FPMRS:
      # Urodynamic testing (DIAGNOSTIC - specific to urogynecology)
      - "51725"  # Simple cystometrogram
      - "51726"  # Complex cystometrogram
      - "51727"  # Complex cystometrogram with voiding pressure studies
      - "51728"  # Complex cystometrogram with voiding pressure studies and uroflowmetry
      - "51729"  # Complex cystometrogram with electromyography
      - "51736"  # Simple uroflowmetry
      - "51741"  # Complex uroflowmetry
      - "51784"  # Electromyography studies of anal or urethral sphincter
      - "51797"  # Voiding pressure studies
      - "51798"  # Measurement of post-voiding residual urine (PVR) - KEY UROGYN TEST
      - "51840"  # Cystometrogram, initial study
      - "51841"  # EMG studies
      - "51845"  # Urodynamics, comprehensive (includes cystometrogram, uroflowmetry, and voiding pressure)
      # Surgical procedures
      - "57260"  # Vaginal repair procedures (anterior and/or posterior)
      - "57265"  # Extensive vaginal repair
      - "57288"  # Sling operation for stress incontinence
      - "57284"  # Paravaginal repair (paravaginal defect repair)
      - "57285"  # Paravaginal repair with mesh
      - "58263"  # Hysterectomy with repair of enterocele
      - "58267"  # Vaginal hysterectomy with repair
      - "58152"  # Total abdominal hysterectomy
      - "58180"  # Supracervical hysterectomy

    MFM:
      # Advanced obstetric ultrasound (MFM-specific imaging)
      - "76801"  # Obstetric ultrasound, real-time with image documentation, fetal and maternal evaluation
      - "76805"  # Ultrasound, pregnant uterus, real-time with image documentation
      - "76810"  # Ultrasound, pregnant uterus, complete, single or first gestation
      - "76811"  # Detailed fetal anatomic examination, single or first gestation
      - "76812"  # Detailed fetal anatomic examination, each additional gestation
      - "76813"  # Ultrasound, pregnant uterus, additional fetal evaluation
      - "76815"  # Limited obstetric ultrasound, single or first gestation
      - "76816"  # Follow-up or repeat obstetric ultrasound
      - "76817"  # Transvaginal obstetric ultrasound
      - "76818"  # Fetal biophysical profile
      - "76819"  # Fetal biophysical profile with non-stress test
      - "76820"  # Doppler velocimetry, fetal umbilical artery
      - "76821"  # Doppler velocimetry, fetal middle cerebral artery
      # Fetal testing (MFM-specific)
      - "59025"  # Fetal non-stress test (NST)
      - "59030"  # Fetal scalp blood sampling (intrapartum)
      - "59050"  # Fetal monitoring during labor, includes non-stress and/or contraction stress testing
      - "59051"  # Fetal monitoring during labor, interpretation only
      # Advanced fetal procedures (MFM-specific interventions)
      - "59070"  # Transabdominal amniocentesis
      - "59072"  # Fetal umbilical cord occlusion
      - "59074"  # Fetal fluid drainage (thoracentesis, paracentesis)
      - "59076"  # Fetal shunt placement
      - "59897"  # Unlisted fetal invasive procedure
      # Genetic testing coordination
      - "81420"  # Fetal chromosomal aneuploidy (e.g., NIPT coordination)

    REI:
      # IVF-specific procedures (REI hallmark)
      - "58970"  # Follicle puncture for oocyte retrieval (transvaginal)
      - "58974"  # Embryo transfer, intrauterine
      - "58976"  # Gamete, zygote, or embryo intrafallopian transfer (GIFT, ZIFT)
      # Laboratory procedures (IVF-specific)
      - "89250"  # Culture of oocyte(s)/embryo(s), less than 4 days
      - "89251"  # Culture of oocyte(s)/embryo(s), less than 4 days; with co-culture
      - "89253"  # Assisted embryo hatching, microtechniques
      - "89254"  # Oocyte identification from follicular fluid
      - "89255"  # Preparation of embryo for transfer
      - "89257"  # Sperm identification from testis tissue, fresh or cryopreserved
      - "89258"  # Cryopreservation of embryo(s)
      - "89259"  # Sperm identification from aspiration (other than testis)
      - "89260"  # Sperm isolation; simple prep
      - "89261"  # Sperm isolation; complex prep
      - "89264"  # Sperm identification from testis tissue, fresh or cryopreserved, with preparation
      - "89268"  # Insemination of oocytes
      - "89272"  # Extended culture of oocyte(s)/embryo(s), 4-7 days
      - "89280"  # Assisted oocyte fertilization, microtechnique (ICSI)
      - "89281"  # Assisted oocyte fertilization, microtechnique; greater than 10 oocytes
      # Diagnostic procedures (infertility workup)
      - "58340"  # Catheterization and introduction of saline or contrast for hysterosalpingography (HSG)
      - "58345"  # Transcervical introduction of fallopian tube catheter
      - "76831"  # Saline infusion sonohysterography (SIS)
      # Surgical treatment of infertility
      - "58545"  # Laparoscopy, surgical; with adhesiolysis (pelvic adhesions)
      - "58546"  # Laparoscopy, surgical; with adhesiolysis, extensive
      - "58740"  # Lysis of adhesions (fimbrioplasty)
      - "58770"  # Salpingostomy (creates new opening in fallopian tube)
      # Endometriosis treatment (common REI comorbidity)
      - "58662"  # Laparoscopy, surgical; with fulguration or excision of endometriosis

    MIGS:
      - "58541"  # Laparoscopic supracervical hysterectomy
      - "58542"  # Laparoscopic total hysterectomy
      - "58544"  # Laparoscopic radical hysterectomy
      - "58570"  # Laparoscopy with total hysterectomy
      - "58571"  # Laparoscopy with total hysterectomy for uterus 250g or less
      - "58572"  # Laparoscopy with total hysterectomy for uterus >250g
      - "58573"  # Laparoscopy with total hysterectomy and removal of tube(s)
      - "49320"  # Laparoscopy, diagnostic
      - "49321"  # Laparoscopy, surgical; biopsy
      - "58548"  # Laparoscopy, surgical; with removal of ovarian cyst(s)
      - "58550"  # Laparoscopy, surgical; with vaginal hysterectomy
      - "58679"  # Unlisted laparoscopy procedure, oviduct, ovary

    PAG:
      # Pediatric/adolescent-specific gynecology
      - "99381"  # Initial comprehensive preventive medicine (infant)
      - "99382"  # Initial comprehensive preventive medicine (early childhood)
      - "99383"  # Initial comprehensive preventive medicine (late childhood)
      - "99384"  # Initial comprehensive preventive medicine (adolescent)
      - "99391"  # Periodic comprehensive preventive medicine (infant)
      - "99392"  # Periodic comprehensive preventive medicine (early childhood)
      - "99393"  # Periodic comprehensive preventive medicine (late childhood)
      - "99394"  # Periodic comprehensive preventive medicine (adolescent)
      # Adolescent-specific procedures
