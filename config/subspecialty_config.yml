# Documentation: How to add a new specialty
# ===========================================
#
# To add a new specialty (e.g., Cardiology, Neurology):
#
# 1. Add a new top-level section with the specialty code:
#    cardio:
#      subspecialties: [...]
#      generalist_class: "General Cardiology"
#      multiple_class: "Multiple"
#      special_rules: {}
#
# 2. For each subspecialty, provide:
#    - code: Short unique identifier (e.g., "EP" for Electrophysiology)
#    - full_name: Official subspecialty name
#    - aliases: List of common alternate names
#    - exact_matches: Strings that should match exactly
#    - partial_matches: Strings for partial/fuzzy matching
#    - confidence: 0.0-1.0 score for match quality
#
# 3. Update active_specialty at the top of this file
#
# 4. No code changes needed - the subspecialty_standardizer.R
#    reads this config and adapts automatically!
